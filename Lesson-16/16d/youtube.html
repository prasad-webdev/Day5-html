<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Preview with Tooltip</title>
  <link rel="stylesheet" href="video.css">
</head>
<body>

  <div class="video-preview">
    <div class="thumbnail-row">
      <img class="thumbnail" src="thumbnails/thumbnail-1.jpg" alt="Video Thumbnail">
      <div class="video-time">14:20</div>
    </div>

    <div class="video-info-grid">
      <div class="channel-picture">
        <div class="profile-picture-container">
          <a href="https://youtube.com/c/mkbhd" target="_blank">
            <img class="profile-picture" src="channel-pictures/channel-1.jpg" alt="Marques Brownlee">
          </a>
          
          <div class="channel-tooltip">
            <img class="channel-tooltip-picture" src="channel-pictures/channel-1.jpg" alt="Marques Brownlee">
            <div>
              <div class="channel-tooltip-name">Marques Brownlee</div>
              <div class="channel-tooltip-stats">15M subscribers</div>
            </div>
          </div>
        </div>
      </div>

      <div class="video-info">
        <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
        <p class="video-author">Marques Brownlee</p>
        <p class="video-stats">3.4M views &#183; 6 months ago</p>
      </div>
    </div>
  </div>

  <div class="video-preview">
    <div class="thumbnail-row">
      <img class="thumbnail" src="thumbnails/thumbnail-2.jpg" alt="Video Thumbnail">
      <div class="video-time">8:22</div>
    </div>

    <div class="video-info-grid">
      <div class="channel-picture">
        <div class="profile-picture-container">
          <a href="https://youtube.com/c/markiplier" target="_blank">
            <img class="profile-picture" src="channel-pictures/channel-2.jpg" alt="Markiplier">
          </a>
          
          <div class="channel-tooltip">
            <img class="channel-tooltip-picture" src="channel-pictures/channel-2.jpg" alt="Markiplier">
            <div>
              <div class="channel-tooltip-name">Markiplier</div>
              <div class="channel-tooltip-stats">30M subscribers</div>
            </div>
          </div>
        </div>
      </div>

      <div class="video-info">
        <p class="video-title">Try Not To Laugh Challenge #9</p>
        <p class="video-author">Markiplier</p>
        <p class="video-stats">19M views &#183; 4 years ago</p>
      </div>
    </div>
  </div>

</body>
</html>
